<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${mode == 'edit' ? 'Sửa sinh viên' : (mode == 'view' ? 'Chi tiết sinh viên' : 'Thêm sinh viên')}">Sinh viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="/adminlte/css/adminlte.css" />
    <link rel="stylesheet" href="/assets/css/student.css" />
  </head>
  <body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
    <div class="app-wrapper">
      <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                <i class="bi bi-list"></i>
              </a>
            </li>
            <li class="nav-item d-none d-md-block">
              <span class="nav-link fw-semibold">Quản lý đào tạo</span>
            </li>
          </ul>
        </div>
      </nav>

      <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
          <a href="#" class="brand-link">
            <img src="/adminlte/assets/img/AdminLTELogo.png" alt="AdminLTE Logo" class="brand-image opacity-75 shadow" />
            <span class="brand-text fw-light">School Manager</span>
          </a>
        </div>
        <div class="sidebar-wrapper">
          <nav class="mt-2">
            <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="navigation" data-accordion="false">
              <li class="nav-item">
                <a href="/students" class="nav-link active">
                  <i class="nav-icon bi bi-people-fill"></i>
                  <p>Sinh viên</p>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <main class="app-main">
        <div class="app-content-header">
          <div class="container-fluid">
            <div class="row align-items-center">
              <div class="col-sm-6">
                <h3 class="mb-0" th:text="${mode == 'edit' ? 'Sửa sinh viên' : (mode == 'view' ? 'Chi tiết sinh viên' : 'Thêm sinh viên')}">Sinh viên</h3>
              </div>
              <div class="col-sm-6">
                <ol class="breadcrumb float-sm-end mb-0">
                  <li class="breadcrumb-item"><a href="/students">Danh sách</a></li>
                  <li class="breadcrumb-item active" aria-current="page" th:text="${mode == 'edit' ? 'Sửa' : (mode == 'view' ? 'Xem' : 'Thêm')}">Thêm</li>
                </ol>
              </div>
            </div>
          </div>
        </div>

        <div class="app-content">
          <div class="container-fluid">
            <div class="card form-card shadow-sm border-0">
              <div class="card-header">
                <h3 class="card-title mb-0" th:text="${mode == 'edit' ? 'Cập nhật sinh viên' : (mode == 'view' ? 'Thông tin sinh viên' : 'Thêm sinh viên mới')}">Sinh viên</h3>
              </div>
              <div class="card-body">
                <form th:action="${mode == 'edit'} ? @{/students/{id}/edit(id=${student.id})} : @{/students}" method="post" th:object="${student}">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label">Mã sinh viên</label>
                      <input type="text" th:field="*{studentCode}" class="form-control" th:readonly="${readOnly != null && readOnly}" />
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Họ và tên</label>
                      <input type="text" th:field="*{fullName}" class="form-control" th:readonly="${readOnly != null && readOnly}" />
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Email</label>
                      <input type="email" th:field="*{email}" class="form-control" th:readonly="${readOnly != null && readOnly}" />
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Số điện thoại</label>
                      <input type="text" th:field="*{phone}" class="form-control" th:readonly="${readOnly != null && readOnly}" />
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Lớp</label>
                      <input type="text" th:field="*{className}" class="form-control" th:readonly="${readOnly != null && readOnly}" />
                    </div>
                  </div>

                  <div class="mt-4 d-flex gap-2">
                    <button th:if="${mode == 'edit'}" type="submit" class="btn btn-primary">
                      <i class="bi bi-check-circle me-1"></i>Lưu thay đổi
                    </button>
                    <button th:if="${mode == 'create'}" type="submit" class="btn btn-primary">
                      <i class="bi bi-plus-circle me-1"></i>Thêm sinh viên
                    </button>
                    <a th:href="@{/students}" class="btn btn-secondary">
                      <i class="bi bi-arrow-left me-1"></i>Quay lại
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="/adminlte/js/adminlte.js"></script>
    <script src="/assets/js/student.js"></script>
  </body>
</html>
