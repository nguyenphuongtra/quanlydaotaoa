<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý sinh viên | AdminLTE 4</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="/adminlte/css/adminlte.css" />
    <link rel="stylesheet" href="/assets/css/student.css" />
  </head>

  <body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
    <div class="app-wrapper">
      <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                <i class="bi bi-list"></i>
              </a>
            </li>
            <li class="nav-item d-none d-md-block">
              <span class="nav-link fw-semibold">Quản lý đào tạo</span>
            </li>
          </ul>
        </div>
      </nav>

      <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
          <a href="#" class="brand-link">
            <img src="/adminlte/assets/img/AdminLTELogo.png" alt="AdminLTE Logo" class="brand-image opacity-75 shadow" />
            <span class="brand-text fw-light">School Manager</span>
          </a>
        </div>

        <div class="sidebar-wrapper">
          <nav class="mt-2">
            <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="navigation" data-accordion="false">
              <li class="nav-item">
                <a href="#" class="nav-link active">
                  <i class="nav-icon bi bi-people-fill"></i>
                  <p>Sinh viên</p>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <main class="app-main">
        <div class="app-content-header">
          <div class="container-fluid">
            <div class="row align-items-center">
              <div class="col-sm-6">
                <h3 class="mb-0">Quản lý sinh viên</h3>
              </div>
              <div class="col-sm-6">
                <ol class="breadcrumb float-sm-end mb-0">
                  <li class="breadcrumb-item"><a href="#">Trang chủ</a></li>
                  <li class="breadcrumb-item active" aria-current="page">Sinh viên</li>
                </ol>
              </div>
            </div>
          </div>
        </div>

        <div class="app-content">
          <div class="container-fluid">
            <div class="card shadow-sm border-0">
              <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
                <h3 class="card-title mb-0">Danh sách sinh viên</h3>
                <div class="d-flex flex-wrap align-items-center gap-2">
                  <form method="get" th:action="@{/students}" class="d-flex gap-2 align-items-center">
                    <div class="input-group input-group-sm" style="width: 320px;">
                      <span class="input-group-text"><i class="bi bi-search"></i></span>
                      <input type="text" name="keyword" class="form-control" placeholder="Tìm theo mã / họ tên / email..." th:value="${keyword}" />
                    </div>
                    <button class="btn btn-primary btn-sm" type="submit">
                      <i class="bi bi-funnel me-1"></i>Tìm kiếm
                    </button>
                  </form>
                  <a class="btn btn-primary btn-sm" th:href="@{/students/new}">
                    <i class="bi bi-plus-circle me-1"></i>Thêm sinh viên
                  </a>
                </div>
              </div>

              <div class="card-body p-0">
                <div class="table-responsive">
                  <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th style="width: 18%;">Mã sinh viên</th>
                        <th style="width: 24%;">Họ và tên</th>
                        <th style="width: 22%;">Email</th>
                        <th style="width: 16%;">Số điện thoại</th>
                        <th style="width: 12%;">Lớp</th>
                        <th style="width: 8%;" class="text-end">Hành động</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="6" class="text-center text-muted py-4">Không có dữ liệu sinh viên</td>
                      </tr>

                      <tr th:each="student : ${students}">
                        <td th:text="${student.studentCode}"></td>
                        <td>
                          <div class="d-flex align-items-center gap-2">
                            <span th:text="${student.fullName}"></span>
                          </div>
                        </td>
                        <td th:text="${student.email}"></td>
                        <td th:text="${student.phone}"></td>
                        <td th:text="${student.className}"></td>
                        <td class="text-end">
                          <div class="table-actions">
                            <a class="btn btn-info btn-sm" th:href="@{/students/{id}(id=${student.id})}" title="Xem">
                              <i class="bi bi-eye"></i>
                            </a>
                            <a class="btn btn-warning btn-sm" th:href="@{/students/{id}/edit(id=${student.id})}" title="Sửa">
                              <i class="bi bi-pencil-square"></i>
                            </a>
                            <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa sinh viên này?');">
                              <button type="submit" class="btn btn-danger btn-sm" title="Xóa">
                                <i class="bi bi-trash"></i>
                              </button>
                            </form>
                          </div>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <footer class="app-footer">
        <div class="float-end d-none d-sm-inline">School Manager</div>
        <strong>Quản lý sinh viên | AdminLTE 4</strong>
      </footer>
    </div>

    <script src="/adminlte/js/adminlte.js"></script>
    <script src="/assets/js/student.js"></script>
  </body>
</html>
